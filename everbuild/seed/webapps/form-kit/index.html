<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Form Kit</title>
  <style>
    :root { --ink: #111827; --muted: #4b5563; --line: #d1d5db; --focus: #1d4ed8; --err: #b91c1c; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 28px; color: var(--ink); background: #fff; }
    h1 { font-size: 22px; margin: 0 0 4px; } .lead { color: var(--muted); margin: 0 0 20px; }
    form { max-width: 420px; display: grid; gap: 16px; }
    label { font-weight: 600; display: block; margin-bottom: 4px; } .hint { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; min-height: 44px; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    input[aria-invalid="true"] { border-color: var(--err); } .error { color: var(--err); font-size: 13px; margin-top: 6px; min-height: 1em; }
    button { font: inherit; font-weight: 600; background: var(--ink); color: #fff; border: 0; border-radius: 6px; min-height: 44px; padding: 0 18px; cursor: pointer; }
    #status { padding: 10px 12px; border-radius: 6px; background: #ecfdf5; color: #065f46; display: none; }
  </style>
</head>
<body>
  <h1>Accessible Form Kit</h1>
  <p class="lead">Validation messages are announced to screen readers and tied to their fields.</p>
  <form id="f" novalidate>
    <div><label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name" aria-describedby="name-err" required>
      <div class="error" id="name-err" aria-live="polite"></div></div>
    <div><label for="email">Email</label><p class="hint" id="email-hint">We'll only use this to reply.</p>
      <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-hint email-err" required>
      <div class="error" id="email-err" aria-live="polite"></div></div>
    <div><label for="zip">ZIP code</label>
      <input id="zip" name="zip" inputmode="numeric" autocomplete="postal-code" aria-describedby="zip-err" required>
      <div class="error" id="zip-err" aria-live="polite"></div></div>
    <button type="submit">Submit</button>
    <div id="status" role="status"></div>
  </form>
  <script>
    var rules = {
      name: function (v) { return v.trim().length < 2 ? "Enter your full name." : ""; },
      email: function (v) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? "" : "Enter an email address like name@example.com."; },
      zip: function (v) { return /^\d{5}$/.test(v) ? "" : "ZIP code must be 5 digits."; }
    };
    function check(i) { var m = rules[i.name](i.value); i.setAttribute("aria-invalid", m ? "true" : "false"); document.getElementById(i.id + "-err").textContent = m; return !m; }
    var form = document.getElementById("f");
    form.querySelectorAll("input").forEach(function (i) { i.addEventListener("blur", function () { check(i); }); });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var bad = Array.prototype.filter.call(form.querySelectorAll("input"), function (i) { return !check(i); });
      var s = document.getElementById("status");
      if (bad.length) { bad[0].focus(); s.style.display = "none"; return; }
      s.style.display = "block"; s.textContent = "Thanks! Your details passed validation.";
    });
  </script>
</body>
</html>
