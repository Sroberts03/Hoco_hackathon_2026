<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Grid</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; font-size: 18px; color: #0f172a; }
    h1 { font-size: 24px; margin: 0 0 4px; } p { color: #475569; margin: 0 0 16px; font-size: 15px; }
    table { border-collapse: separate; border-spacing: 6px; } th { text-align: left; font-weight: 600; padding-right: 12px; }
    button { width: 44px; height: 44px; border-radius: 8px; border: 2px solid #94a3b8; background: #fff; font-size: 20px; cursor: pointer; }
    button[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; color: #fff; } button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Habit Grid</h1>
  <p>Tab into the grid, use arrow keys to move, Space to toggle a day.</p>
  <table id="t" role="grid"></table>
  <script>
    var habits = ["Walk", "Read", "Water", "Stretch"], days = ["M", "T", "W", "T", "F", "S", "S"], t = document.getElementById("t");
    t.innerHTML = "<tr><th></th>" + days.map(function (d) { return "<th>" + d + "</th>"; }).join("") + "</tr>" + habits.map(function (h, r) {
      return "<tr><th scope='row'>" + h + "</th>" + days.map(function (d, c) { return "<td><button data-r='" + r + "' data-c='" + c + "' aria-pressed='false' aria-label='" + h + " day " + (c + 1) + "'></button></td>"; }).join("") + "</tr>";
    }).join("");
    t.onclick = function (e) { var b = e.target.closest("button"); if (!b) return; var on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); b.textContent = on ? "✓" : ""; };
    t.onkeydown = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var m = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key]; if (!m) return; e.preventDefault();
      var n = t.querySelector("button[data-r='" + (+b.dataset.r + m[0]) + "'][data-c='" + (+b.dataset.c + m[1]) + "']"); if (n) n.focus();
    };
  </script>
</body>
</html>
