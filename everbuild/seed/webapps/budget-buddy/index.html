<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Buddy</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f5f4; color: #1c1917; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; max-width: 520px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    h1 { font-size: 20px; margin: 0 0 12px; } form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { font: inherit; padding: 6px 8px; border: 1px solid #d6d3d1; border-radius: 6px; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 0; background: #1c1917; color: #fff; }
    ul { list-style: none; padding: 0; margin: 0; } li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
    .total { font-weight: 600; margin-top: 12px; display: flex; justify-content: space-between; } .neg { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Budget Buddy</h1>
    <form id="f"><input id="label" placeholder="Rent, groceries…" required><input id="amt" type="number" step="0.01" placeholder="-1200" required style="width:110px"><button>Add</button></form>
    <ul id="list"></ul>
    <div class="total"><span>Balance</span><span id="total"></span></div>
  </div>
  <script>
    // Storage is unavailable inside a sandboxed iframe, so this demo keeps data in memory.
    var items = [{ label: "Paycheck", amt: 2400 }, { label: "Rent", amt: -1250 }, { label: "Groceries", amt: -320 }];
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function render() {
      document.getElementById("list").innerHTML = items.map(function (i) { return "<li><span>" + esc(i.label) + "</span><span class='" + (i.amt < 0 ? "neg" : "") + "'>" + i.amt.toFixed(2) + "</span></li>"; }).join("");
      var t = items.reduce(function (a, b) { return a + b.amt; }, 0), el = document.getElementById("total");
      el.textContent = "$" + t.toFixed(2); el.className = t < 0 ? "neg" : "";
    }
    document.getElementById("f").onsubmit = function (e) { e.preventDefault(); items.push({ label: document.getElementById("label").value, amt: Number(document.getElementById("amt").value) }); e.target.reset(); render(); };
    render();
  </script>
</body>
</html>
