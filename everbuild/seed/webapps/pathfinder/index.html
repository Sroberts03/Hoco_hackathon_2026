<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfinder Visualizer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fbfbfa; color: #1c1917; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 14px; flex-wrap: wrap; }
    button, select { font: inherit; padding: 6px 12px; border: 1px solid #d6d3d1; background: #fff; border-radius: 6px; cursor: pointer; }
    #grid { display: grid; grid-template-columns: repeat(32, 1fr); gap: 1px; background: #e7e5e4; user-select: none; }
    .c { aspect-ratio: 1; background: #fff; } .wall { background: #44403c; } .seen { background: #bfdbfe; }
    .path { background: #f59e0b; } .start { background: #16a34a; } .end { background: #dc2626; }
  </style>
</head>
<body>
  <h1>Pathfinder Visualizer</h1>
  <div class="bar">
    <select id="algo"><option value="bfs">Breadth-first search</option><option value="astar">A* (Manhattan)</option></select>
    <button id="run">Run</button><button id="maze">Random walls</button><button id="clear">Clear</button>
    <span id="stats">Drag on the grid to draw walls.</span>
  </div>
  <div id="grid"></div>
  <script>
    var W = 32, H = 18, S = [2, 9], E = [29, 9], cells = [], walls = new Set(), down = false, grid = document.getElementById("grid");
    var key = function (x, y) { return x + "," + y; };
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) { var d = document.createElement("div"); d.className = "c"; d.dataset.k = key(x, y); grid.appendChild(d); cells.push(d); }
    var cell = function (x, y) { return cells[y * W + x]; };
    function paint() { cells.forEach(function (c) { c.className = "c" + (walls.has(c.dataset.k) ? " wall" : ""); }); cell(S[0], S[1]).className = "c start"; cell(E[0], E[1]).className = "c end"; }
    function toggle(e) { var k = e.target.dataset.k; if (!k || k === key(S[0], S[1]) || k === key(E[0], E[1])) return; walls.add(k); paint(); }
    grid.onmousedown = function (e) { down = true; toggle(e); }; grid.onmouseover = function (e) { if (down) toggle(e); }; window.onmouseup = function () { down = false; };
    document.getElementById("clear").onclick = function () { walls.clear(); paint(); };
    document.getElementById("maze").onclick = function () {
      walls.clear(); var seed = Math.floor(Math.random() * 1e6);
      for (var i = 0; i < W * H * 0.28; i++) { seed = (seed * 9301 + 49297) % 233280; var r = seed / 233280; walls.add(key(Math.floor(r * W), Math.floor(((r * 997) % 1) * H))); }
      walls.delete(key(S[0], S[1])); walls.delete(key(E[0], E[1])); paint();
    };
    document.getElementById("run").onclick = function () {
      paint();
      var astar = document.getElementById("algo").value === "astar";
      var h = function (p) { return astar ? Math.abs(p[0] - E[0]) + Math.abs(p[1] - E[1]) : 0; };
      var open = [[S, 0]], prev = {}, dist = {}, order = []; dist[key(S[0], S[1])] = 0;
      while (open.length) {
        open.sort(function (a, b) { return a[1] + h(a[0]) - (b[1] + h(b[0])); });
        var cur = open.shift()[0], ck = key(cur[0], cur[1]); order.push(cur);
        if (ck === key(E[0], E[1])) break;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
          var n = [cur[0] + d[0], cur[1] + d[1]], nk = key(n[0], n[1]);
          if (n[0] < 0 || n[1] < 0 || n[0] >= W || n[1] >= H || walls.has(nk) || nk in dist) return;
          dist[nk] = dist[ck] + 1; prev[nk] = ck; open.push([n, dist[nk]]);
        });
      }
      var i = 0;
      (function step() {
        for (var j = 0; j < 6 && i < order.length; j++, i++) { var c = cell(order[i][0], order[i][1]); if (c.className === "c") c.className = "c seen"; }
        if (i < order.length) return requestAnimationFrame(step);
        var k = prev[key(E[0], E[1])], len = 0;
        while (k && k !== key(S[0], S[1])) { var xy = k.split(",").map(Number); cell(xy[0], xy[1]).className = "c path"; k = prev[k]; len++; }
        document.getElementById("stats").textContent = "Visited " + order.length + " cells · path " + (prev[key(E[0], E[1])] ? len + 1 : "not found");
      })();
    };
    paint();
  </script>
</body>
</html>
